[Unit]
# CST DEV safety gate: obsolete credentials in the legacy standalone checkout
# previously caused Supavisor 28P01 and shared auth circuit breaker incidents.
# This service must not be manually started or restarted by background agents.
# Re-enable only AFTER the approved restricted CST-DEV reader authentication
# passes with exact pinned code release and authorized operator approval.
RefuseManualStart=yes
ConditionPathExists=/etc/ai-task-dev-authorized-reader-and-release.ready

[Service]
Restart=no
