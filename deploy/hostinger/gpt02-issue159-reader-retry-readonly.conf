# DEV-only trusted Hub/Core evidence reader. Read-only, no issuer or dispatch.
# A transient direct Supabase connection refusal previously exhausted the
# default 3 restarts within 60 s and left the reader permanently failed.
# Retry no more often than once per minute until the database is reachable.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=60s
