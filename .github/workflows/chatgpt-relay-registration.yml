name: ChatGPT relay registration checks
on:
  pull_request:
    paths:
      - "artifacts/api-server/src/routes/chatgpt-registration.ts"
      - "artifacts/api-server/src/routes/chatgpt-relay-verifier.ts"
      - "artifacts/api-server/src/routes/chatgpt-relay-verifier.test.ts"
      - "integrations/chatgpt-hash-registration/**"
      - ".github/workflows/chatgpt-relay-registration.yml"
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server typecheck
