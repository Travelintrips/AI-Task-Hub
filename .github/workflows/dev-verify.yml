name: AI Task DEV Verify
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-task-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: AI Task DEV test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: API short-link unit regression
        run: pnpm --filter @workspace/api-server run test:short-links
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
