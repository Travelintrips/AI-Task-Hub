name: AI Task DEV Verify
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-task-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: AI Task DEV test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: API short-link unit regression
        run: pnpm --filter @workspace/api-server run test:short-links
      - name: Verify read-only bridge GET cannot mutate lifecycle
        run: node --test artifacts/api-server/tests/bridge-ledger-readback.test.mjs artifacts/api-server/tests/bridge-ledger-event-summary.test.mjs artifacts/api-server/tests/bridge-ledger-source-progress.test.mjs
      - name: Verify read-only DEV deployment preflight fails closed
        run: node --test scripts/dev/bridge-ledger-readback-runtime-preflight.test.mjs
      - name: Fail closed on privileged AI Task DEV database login cutover
        run: node --test scripts/dev/gpt02-hub-db-login-cutover-readonly.test.cjs
      - name: Inventory DEV application database surface conservatively
        run: node --test scripts/dev/gpt02-hub-db-static-access-inventory.test.cjs
      - name: Verify isolated PostgreSQL 16 tenant RLS policy boundaries
        run: bash scripts/dev/test-gpt02-hub-rls-isolated-postgres.sh
      - name: Verify authenticated tenant admission stays non-authorizing
        run: node --test scripts/dev/gpt02-verified-tenant-scope.test.cjs
      - name: Verify AI Task child resources cannot cross tenant boundaries
        run: node --test artifacts/api-server/tests/ai-task-child-tenant-scope.test.mjs
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
