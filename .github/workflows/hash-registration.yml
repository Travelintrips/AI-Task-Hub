name: Hash Registration Unit Tests
on:
  pull_request:
    paths:
      - "integrations/chatgpt-hash-registration/**"
      - ".github/workflows/hash-registration.yml"
  push:
    branches: [main]
    paths:
      - "integrations/chatgpt-hash-registration/**"
      - ".github/workflows/hash-registration.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test integrations/chatgpt-hash-registration/register.test.mjs
