name: Task183 isolated root signer supervisor candidate
on:
  push:
    branches:
      - fix/dev-task183-prep-readiness-ui-20261121
    paths:
      - 'scripts/dev/task183-independent-owner-adapter.candidate.py'
      - 'scripts/dev/task183-independent-owner-adapter.candidate.test.py'
      - 'scripts/dev/task183-owner-recovery-decision-reader.py'
      - 'scripts/dev/task183-two-phase-unix-bridge.candidate.py'
      - 'scripts/dev/task183-two-phase-unix-bridge.candidate.test.py'
      - 'scripts/dev/task183-patch-existing-signer-two-phase.candidate.py'
      - 'scripts/dev/task183-patch-existing-signer-two-phase.candidate.test.py'
      - 'scripts/dev/task183-exact-live-operational-signer.snapshot.py.txt'
      - 'scripts/dev/task183-two-phase-signing.candidate.py'
      - 'scripts/dev/task183-two-phase-signing.candidate.test.py'
      - 'scripts/dev/task183-local-receipt-broker.candidate.py'
      - 'scripts/dev/task183-local-receipt-broker.candidate.test.py'
      - 'scripts/dev/task183-root-sign-once-supervisor.candidate.py'
      - 'scripts/dev/task183-root-sign-once-supervisor.candidate.test.py'
      - 'scripts/dev/task183-dormant-signature-custody.py'
      - '.github/workflows/task183-root-supervisor-candidate.yml'
  pull_request:
    paths:
      - 'scripts/dev/task183-root-sign-once-supervisor.candidate.py'
      - 'scripts/dev/task183-root-sign-once-supervisor.candidate.test.py'
      - 'scripts/dev/task183-dormant-signature-custody.py'
      - '.github/workflows/task183-root-supervisor-candidate.yml'
permissions:
  contents: read
jobs:
  isolated-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: python3 -m py_compile scripts/dev/task183-root-sign-once-supervisor.candidate.py scripts/dev/task183-root-sign-once-supervisor.candidate.test.py scripts/dev/task183-local-receipt-broker.candidate.py scripts/dev/task183-local-receipt-broker.candidate.test.py scripts/dev/task183-two-phase-signing.candidate.py scripts/dev/task183-two-phase-signing.candidate.test.py scripts/dev/task183-patch-existing-signer-two-phase.candidate.py scripts/dev/task183-patch-existing-signer-two-phase.candidate.test.py scripts/dev/task183-two-phase-unix-bridge.candidate.py scripts/dev/task183-two-phase-unix-bridge.candidate.test.py
      - name: Synthetic concurrent crash and replay proof
        run: python3 scripts/dev/task183-root-sign-once-supervisor.candidate.test.py
      - name: Synthetic Unix broker peer custody replay and restart proof
        run: python3 scripts/dev/task183-local-receipt-broker.candidate.test.py
      - name: Two-phase signer reserve and commit crash proof
        run: python3 scripts/dev/task183-two-phase-signing.candidate.test.py
      - name: Install isolated Ed25519 test dependency
        run: python3 -m pip install --user cryptography
      - name: Gate actual approval and recovery signer methods using ephemeral key
        run: python3 scripts/dev/task183-patch-existing-signer-two-phase.candidate.test.py
      - name: Two-phase Unix broker process identity and restart proof
        run: python3 scripts/dev/task183-two-phase-unix-bridge.candidate.test.py
      - name: Validate independent Owner decision provenance with the existing reader
        run: python3 scripts/dev/task183-independent-owner-adapter.candidate.test.py
