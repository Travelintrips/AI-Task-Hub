kind = "web"
previewPath = "/"
title = "AI Task Center"
version = "1.0.0"
id = "artifacts/ai-task-center"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/assets"]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/ai-task-center run build && pnpm --filter @workspace/ai-task-center run serve"

[services.production]

[services.production.build]
args = [
  "sh",
  "-c",
  "pnpm --filter @workspace/ai-task-center run build",
]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/ai-task-center", "run", "serve"]

[services.production.run.env]
PORT = "5173"
NODE_ENV = "production"

[services.env]
PORT = "5173"
BASE_PATH = "/"
