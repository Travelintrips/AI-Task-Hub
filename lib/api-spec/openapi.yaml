openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Task Center API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Task management
  - name: team
    description: Team member management
  - name: messages
    description: WhatsApp message inbox
  - name: documents
    description: Document audit management
  - name: dashboard
    description: Dashboard summaries and stats
  - name: audits
    description: Document audit results and WhatsApp reply generation
  - name: whatsapp-send
    description: WhatsApp outbound notification sender
  - name: customers
    description: Customer context management
  - name: notifications
    description: Admin in-app notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Tasks ────────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: assigneeId
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get task by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}/assign:
    patch:
      operationId: assignTask
      tags: [tasks]
      summary: Assign task to a team member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskAssignment"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  # ── Team Members ─────────────────────────────────────────────────────────────
  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List all team members
      responses:
        "200":
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [team]
      summary: Create a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Created team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"

  /team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Update a team member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
    delete:
      operationId: deleteTeamMember
      tags: [team]
      summary: Delete a team member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── WhatsApp Messages ────────────────────────────────────────────────────────
  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List received WhatsApp messages
      parameters:
        - in: query
          name: processed
          schema:
            type: boolean
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhatsAppMessage"

  /messages/{id}/process:
    post:
      operationId: processMessage
      tags: [messages]
      summary: Re-run AI intent detection on a message and create task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Processing result with detected intent and created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageProcessResult"

  /messages/send:
    post:
      operationId: sendWhatsAppMessage
      tags: [messages]
      summary: Send a WhatsApp notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "200":
          description: Send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResult"

  # ── WhatsApp Webhook ─────────────────────────────────────────────────────────
  /webhook/whatsapp:
    get:
      operationId: verifyWhatsAppWebhook
      tags: [messages]
      summary: WhatsApp webhook verification (GET challenge)
      parameters:
        - in: query
          name: hub.mode
          schema:
            type: string
        - in: query
          name: hub.verify_token
          schema:
            type: string
        - in: query
          name: hub.challenge
          schema:
            type: string
      responses:
        "200":
          description: Challenge echoed back
    post:
      operationId: receiveWhatsAppWebhook
      tags: [messages]
      summary: Receive incoming WhatsApp message events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: Acknowledged

  # ── Documents ────────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all audited documents
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload a document for AI audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /documents/{id}/audit:
    post:
      operationId: auditDocument
      tags: [documents]
      summary: Run AI audit on an uploaded document
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  # ── Upload presigned URL (Supabase Storage) ──────────────────────────────────
  /documents/upload-url:
    post:
      operationId: getUploadUrl
      tags: [documents]
      summary: Get a presigned upload URL from Supabase Storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  # ── Dashboard / Analytics ────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get aggregated dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── WhatsApp Send ─────────────────────────────────────────────────────────────
  /whatsapp/send:
    post:
      operationId: sendWhatsAppNotification
      tags: [whatsapp-send]
      summary: Send a templated WhatsApp notification to a customer, admin, or team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppSendRequest"
      responses:
        "200":
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSendResponse"
        "202":
          description: Notification saved but not sent (gateway not configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSendResponse"
        "400":
          description: Validation error
        "500":
          description: Gateway error

  # ── Customer Context ─────────────────────────────────────────────────────────
  /customers/{phone}:
    get:
      operationId: getCustomerContext
      tags: [customers]
      summary: Get stored customer context by phone number
      parameters:
        - in: path
          name: phone
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerContextRecord"
        "404":
          description: Not found
    patch:
      operationId: updateCustomerContext
      tags: [customers]
      summary: Update customer context notes
      parameters:
        - in: path
          name: phone
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerContextUpdate"
      responses:
        "200":
          description: Updated customer context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerContextRecord"

  # ── Admin Notifications ───────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List admin notifications (most recent first)
      parameters:
        - in: query
          name: unreadOnly
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminNotification"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Get count of unread notifications
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  # ── Audits ───────────────────────────────────────────────────────────────────
  /audits/{id}/whatsapp-reply:
    post:
      operationId: generateWhatsAppReply
      tags: [audits]
      summary: Generate a polite Indonesian WhatsApp follow-up for missing audit items
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated WhatsApp message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppReply"
        "404":
          description: Audit not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Task ──────────────────────────────────────────────────────────────────
    Task:
      type: object
      required: [id, title, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled, assigned]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: ["integer", "null"]
        assigneeName:
          type: ["string", "null"]
        assignedRole:
          type: ["string", "null"]
        assignedDivision:
          type: ["string", "null"]
        assignedVendor:
          type: ["string", "null"]
        customerName:
          type: ["string", "null"]
        sourceMessageId:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    TaskInput:
      type: object
      required: [title, priority]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: integer
        dueDate:
          type: string
        tags:
          type: array
          items:
            type: string

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        assigneeId:
          type: integer
        dueDate:
          type: string
        tags:
          type: array
          items:
            type: string

    TaskAssignment:
      type: object
      properties:
        assigneeId:
          type: integer
        assignedRole:
          type: string
        assignedDivision:
          type: string
        assignedVendor:
          type: string
        customerName:
          type: string
        miniTaskUrl:
          type: string

    # ── Team Member ───────────────────────────────────────────────────────────
    TeamMember:
      type: object
      required: [id, name, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        division:
          type: ["string", "null"]
        isVendor:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    TeamMemberInput:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
        division:
          type: string
        isVendor:
          type: string
        phone:
          type: string
        email:
          type: string
        avatarUrl:
          type: string

    TeamMemberUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        division:
          type: string
        isVendor:
          type: string
        phone:
          type: string
        email:
          type: string
        avatarUrl:
          type: string

    # ── WhatsApp Message ──────────────────────────────────────────────────────
    WhatsAppMessage:
      type: object
      required: [id, from, body, timestamp, processed, createdAt]
      properties:
        id:
          type: integer
        from:
          type: string
        senderName:
          type: ["string", "null"]
        body:
          type: string
        timestamp:
          type: string
        processed:
          type: boolean
        detectedIntent:
          type: ["string", "null"]
        taskId:
          type: ["integer", "null"]
        createdAt:
          type: string

    MessageProcessResult:
      type: object
      required: [intent, taskCreated]
      properties:
        intent:
          type: string
        taskCreated:
          type: boolean
        task:
          $ref: "#/components/schemas/Task"

    SendMessageInput:
      type: object
      required: [to, message]
      properties:
        to:
          type: string
        message:
          type: string

    SendMessageResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        messageId:
          type: ["string", "null"]
        error:
          type: ["string", "null"]

    WebhookPayload:
      type: object
      properties:
        object:
          type: string
        entry:
          type: array
          items:
            type: object

    # ── Document ──────────────────────────────────────────────────────────────
    Document:
      type: object
      required: [id, filename, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        filename:
          type: string
        fileUrl:
          type: ["string", "null"]
        storagePath:
          type: ["string", "null"]
        mimeType:
          type: ["string", "null"]
        fileSize:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, auditing, audited, error]
        auditSummary:
          type: ["string", "null"]
        auditIssues:
          type: array
          items:
            type: string
        auditScore:
          type: ["integer", "null"]
        taskId:
          type: ["integer", "null"]
        uploadedBy:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    DocumentInput:
      type: object
      required: [filename]
      properties:
        filename:
          type: string
        fileUrl:
          type: string
        storagePath:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
        taskId:
          type: integer
        uploadedBy:
          type: string

    UploadUrlRequest:
      type: object
      required: [filename, mimeType]
      properties:
        filename:
          type: string
        mimeType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadUrl, publicUrl, path]
      properties:
        uploadUrl:
          type: string
        publicUrl:
          type: string
        path:
          type: string

    # ── WhatsApp Send ─────────────────────────────────────────────────────────
    WhatsAppSendRequest:
      type: object
      required: [to, recipientType, templateName]
      properties:
        to:
          type: string
          description: Recipient phone number (international format, e.g. 628123456789)
        recipientType:
          type: string
          enum: [customer, admin, team]
        templateName:
          type: string
          enum:
            - missing_document_request
            - new_task_notification
            - task_assignment
            - progress_update
            - customer_approval_request
            - completed_task_notification
        variables:
          type: object
          additionalProperties: true
          description: >
            Template-specific variables. Keys by template:
            missing_document_request — customerName, taskNumber, missingDocs (string[]);
            new_task_notification — title, taskNumber, customerName, category, priority;
            task_assignment — assigneeName, title, taskNumber, dueDate;
            progress_update — title, status, taskNumber, customerName, updateNote;
            customer_approval_request — customerName, title, taskNumber, details;
            completed_task_notification — title, taskNumber, customerName, completedAt
        taskId:
          type: integer
          description: Associated task ID (optional)
        companyId:
          type: string
          description: Company/tenant ID (defaults to "default")

    WhatsAppSendResponse:
      type: object
      required: [success, notificationId, messageText]
      properties:
        success:
          type: boolean
        notificationId:
          type: integer
          description: ID of the saved whatsapp_notifications record
        externalMessageId:
          type: string
          description: Message ID returned by the WhatsApp gateway (if sent)
        messageText:
          type: string
          description: Rendered message body that was (or would be) sent
        error:
          type: string
          description: Error description if success is false
        configMissing:
          type: boolean
          description: True when gateway env vars are not set (202 response)

    # ── Audit WhatsApp Reply ──────────────────────────────────────────────────
    WhatsAppReply:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ── Dashboard ─────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalTasks, openTasks, completedTasks, urgentTasks, totalMessages, pendingMessages, totalDocuments, auditedDocuments, teamSize]
      properties:
        totalTasks:
          type: integer
        openTasks:
          type: integer
        completedTasks:
          type: integer
        urgentTasks:
          type: integer
        totalMessages:
          type: integer
        pendingMessages:
          type: integer
        totalDocuments:
          type: integer
        auditedDocuments:
          type: integer
        teamSize:
          type: integer

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [task_created, task_updated, task_assigned, message_received, document_audited, member_added]
        description:
          type: string
        entityId:
          type: ["integer", "null"]
        createdAt:
          type: string

    # ── Customer Context ──────────────────────────────────────────────────────
    CustomerContextRecord:
      type: object
      required: [id, phone, companyId, totalTasks, createdAt, updatedAt]
      properties:
        id:
          type: integer
        companyId:
          type: string
        phone:
          type: string
        name:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        frequentService:
          type: ["string", "null"]
        specialNotes:
          type: ["string", "null"]
        previousIntents:
          type: ["string", "null"]
        totalTasks:
          type: integer
        lastActiveTaskId:
          type: ["integer", "null"]
        lastSeenAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    CustomerContextUpdate:
      type: object
      properties:
        name:
          type: string
        companyName:
          type: string
        frequentService:
          type: string
        specialNotes:
          type: string

    # ── Admin Notification ────────────────────────────────────────────────────
    AdminNotification:
      type: object
      required: [id, type, title, body, isRead, createdAt]
      properties:
        id:
          type: integer
        companyId:
          type: string
        type:
          type: string
